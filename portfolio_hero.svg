<svg width="820" height="430" viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071421"/>
      <stop offset="0.55" stop-color="#06070d"/>
      <stop offset="1" stop-color="#100a1c"/>
    </linearGradient>
    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e8fff"/>
      <stop offset="0.55" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#1e8fff"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dff5ff"/>
      <stop offset="0.45" stop-color="#7bd7ff"/>
      <stop offset="1" stop-color="#1e8fff"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1e8fff" stroke-opacity="0.1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#fff" opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feGaussianBlur stdDeviation="10" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <style>
      @keyframes flicker {
        0%, 6%, 8%, 11%, 65%, 68%, 100% { opacity: 1; }
        7%, 67% { opacity: .42; }
        9%, 69% { opacity: .78; }
      }
      @keyframes pulse { 0%, 100% { opacity: .62; } 50% { opacity: 1; } }
      @keyframes cursor { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      .flicker { animation: flicker 5.8s steps(1, end) infinite; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      .cursor { animation: cursor 1s steps(1, end) infinite; }
    </style>
  </defs>

  <rect width="820" height="430" rx="12" fill="url(#heroBg)"/>
  <rect width="820" height="430" rx="12" fill="url(#grid)"/>
  <rect width="820" height="430" rx="12" fill="url(#scan)"/>
  <ellipse cx="650" cy="250" rx="250" ry="170" fill="#1e8fff" opacity=".1" filter="url(#softGlow)"/>
  <ellipse cx="90" cy="120" rx="170" ry="130" fill="#00e5ff" opacity=".07" filter="url(#softGlow)"/>

  <!-- Header rail -->
  <path d="M20 78V18H800L808 26V78Z" fill="#091522" fill-opacity=".88" stroke="#1e8fff" stroke-opacity=".42"/>
  <path d="M20 18H150L160 8H280" fill="none" stroke="#00e5ff" stroke-width="2" filter="url(#glow)"/>
  <path d="M680 78H800V58" fill="none" stroke="#00e5ff" stroke-width="2" filter="url(#glow)"/>
  <path d="M42 33h36v30H42z" fill="#0d2741" stroke="#1e8fff"/>
  <text x="60" y="54" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#00e5ff">N_</text>
  <text x="92" y="54" class="mono" font-size="17" font-weight="700" letter-spacing="3" fill="#e6f1ff">TIENS_</text>
  <circle cx="398" cy="48" r="4" fill="#00e5ff" filter="url(#glow)"/>
  <text x="410" y="53" class="mono" font-size="11" letter-spacing="2" fill="#93a9bd">SYS//ONLINE</text>
  <text x="548" y="53" class="mono" font-size="11" letter-spacing="2" fill="#93a9bd">HOME</text>
  <text x="610" y="53" class="mono" font-size="11" letter-spacing="2" fill="#7bd7ff">./ABOUT</text>
  <text x="690" y="53" class="mono" font-size="11" letter-spacing="2" fill="#93a9bd">SKILLS</text>

  <!-- Left hero copy -->
  <rect x="42" y="106" width="285" height="28" fill="#0b2032" stroke="#1e8fff" stroke-opacity=".7"/>
  <circle cx="57" cy="120" r="4" fill="#00e5ff" filter="url(#glow)"/>
  <text x="70" y="125" class="mono" font-size="10" font-weight="700" letter-spacing="1.8" fill="#00e5ff">SYSTEM ONLINE // OPEN TO OPPORTUNITIES</text>
  <text x="42" y="176" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#f0f7ff">Hi, I'm</text>
  <g class="flicker" filter="url(#glow)">
    <text x="42" y="225" class="mono" font-size="38" font-weight="900" letter-spacing="-1.5" fill="url(#nameFill)" textLength="395" lengthAdjust="spacingAndGlyphs">Nguyễn Nhật Tiến.</text>
  </g>
  <path d="M42 207H437M42 215H437M42 223H437" stroke="#dff5ff" stroke-opacity=".28"/>
  <text x="42" y="253" class="mono" font-size="13" font-weight="700" letter-spacing="1.4" fill="#00e5ff">AI ENGINEER / FULL-STACK DEVELOPER</text>
  <text x="42" y="283" font-family="Inter, Arial, sans-serif" font-size="13" fill="#c6d9ea">Computer Science student focused on applied AI,</text>
  <text x="42" y="303" font-family="Inter, Arial, sans-serif" font-size="13" fill="#c6d9ea">Agentic RAG, computer vision, text-to-3D, and full-stack systems.</text>
  <rect x="42" y="328" width="145" height="32" fill="#1e8fff" filter="url(#glow)"/>
  <text x="114" y="349" text-anchor="middle" class="mono" font-size="11" font-weight="700" letter-spacing="1" fill="#06111e">&gt; VIEW PROJECTS</text>
  <rect x="197" y="328" width="132" height="32" fill="#071421" stroke="#00e5ff"/>
  <text x="263" y="349" text-anchor="middle" class="mono" font-size="11" font-weight="700" letter-spacing="1" fill="#00e5ff">GET IN TOUCH</text>
  <text x="42" y="391" class="mono" font-size="10" letter-spacing="1.4" fill="#93a9bd">&gt; OPEN TO INTERNSHIP</text>
  <text x="230" y="391" class="mono" font-size="10" letter-spacing="1.4" fill="#93a9bd">&gt; CAN THO, VIETNAM</text>

  <!-- Right terminal panel -->
  <rect x="465" y="106" width="315" height="258" rx="8" fill="#090e15" stroke="#1e8fff" stroke-opacity=".8" filter="url(#glow)"/>
  <rect x="465" y="106" width="315" height="34" rx="8" fill="#131c27"/>
  <rect x="465" y="128" width="315" height="12" fill="#131c27"/>
  <circle cx="482" cy="123" r="4" fill="#ff5f56"/>
  <circle cx="496" cy="123" r="4" fill="#ffbd2e"/>
  <circle cx="510" cy="123" r="4" fill="#27c93f"/>
  <text x="530" y="127" class="mono" font-size="9" fill="#63778c">tien@portfolio: ~/current_focus</text>
  <text x="482" y="168" class="mono" font-size="11" font-weight="700" fill="#1e8fff">tien@portfolio:~$ whoami</text>
  <text x="482" y="188" class="mono" font-size="10" fill="#93a9bd">Nguyen Nhat Tien - Computer Science Student</text>
  <text x="482" y="216" class="mono" font-size="11" font-weight="700" fill="#1e8fff">tien@portfolio:~$ cat role.txt</text>
  <text x="482" y="236" class="mono" font-size="10" fill="#93a9bd">AI Engineer | Full-stack Developer</text>
  <text x="482" y="264" class="mono" font-size="11" font-weight="700" fill="#1e8fff">tien@portfolio:~$ ./status.sh</text>
  <text x="482" y="284" class="mono" font-size="10" fill="#00e5ff">[ONLINE] ready to build useful products</text>
  <rect x="482" y="310" width="8" height="15" fill="#00e5ff" class="cursor"/>
  <path d="M755 364H780V339" fill="none" stroke="#00e5ff" stroke-opacity=".7"/>

  <path d="M20 413H800" stroke="url(#blueLine)" stroke-width="2" class="pulse"/>
  <text x="42" y="419" class="mono" font-size="9" letter-spacing="2" fill="#63778c">PORTFOLIO // BUILDING THE NEXT USEFUL THING</text>
</svg>
